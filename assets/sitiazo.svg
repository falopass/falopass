  <text x="48" y="198" class="m" font-size="14">
    <tspan fill="#C9A36A" font-weight="700">$79.990</tspan><tspan fill="#9C9279"> CLP and up</tspan>
    <tspan dx="14" fill="#4A3F28">/</tspan>
    <tspan dx="14" fill="#C9A36A" font-weight="700">624</tspan><tspan fill="#9C9279"> demos</tspan>
  </text>
  <text x="48" y="226" class="m" font-size="12" fill="#6E6450">websites for Chilean SMBs · static export · WhatsApp-first</text>

  <g class="m">
    <rect x="590" y="28" width="340" height="96" rx="10" fill="#0E0C08" stroke="#3A3220"/>
    <path d="M590 38a10 10 0 0 1 10-10h320a10 10 0 0 1 10 10v8H590z" fill="#1A1710"/>
    <circle cx="604" cy="37" r="3" fill="#6E6450"/><circle cx="616" cy="37" r="3" fill="#6E6450"/><circle cx="628" cy="37" r="3" fill="#6E6450"/>
    <rect x="690" y="32" width="170" height="10" rx="5" fill="#0E0C08"/>
    <text x="775" y="40" font-size="8" fill="#6E6450" text-anchor="middle">tu-negocio.cl</text>

    <rect x="608" y="60" width="0" height="12" rx="3" fill="#EFE6D2">
      <animate attributeName="width" values="0;190;190;0" keyTimes="0;.35;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="608" y="80" width="0" height="7" rx="3" fill="#6E6450">
      <animate attributeName="width" values="0;0;150;150;0" keyTimes="0;.15;.45;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="608" y="92" width="0" height="7" rx="3" fill="#4A3F28">
      <animate attributeName="width" values="0;0;110;110;0" keyTimes="0;.25;.55;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="828" y="84" width="84" height="22" rx="11" fill="#C9A36A" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.6;.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="870" y="99" font-size="10" fill="#13110C" text-anchor="middle" font-weight="700" opacity="0">WhatsApp
