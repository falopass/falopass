    </text>

    <g font-size="10.5" letter-spacing="1.5" text-anchor="middle">
      <text x="610" y="156" fill="#EFE6D2">INSTAGRAM</text>
      <text x="760" y="156" fill="#EFE6D2">DEMO · 48 H</text>
