    .s{font-family:Georgia,'Times New Roman',serif}
    @media (prefers-reduced-motion:reduce){.mv{display:none}}
  </style>
  <rect x="1" y="1" width="998" height="258" rx="18" fill="#13110C" stroke="#4A3F28"/>

  <text x="48" y="58" class="m" font-size="12" fill="#C9A36A" letter-spacing="2.5">03 — SITIAZO.CL · CURICÓ, MAULE</text>
