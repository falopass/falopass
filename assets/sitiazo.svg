    <path d="M610 174H910" stroke="#3A3220" stroke-width="2"/>
    <circle cx="610" cy="174" r="5" fill="#13110C" stroke="#9C9279" stroke-width="2"/>
    <circle cx="760" cy="174" r="5" fill="#13110C" stroke="#9C9279" stroke-width="2"/>
    <circle cx="910" cy="174" r="5" fill="#C9A36A"/>
    <circle class="mv" cx="610" cy="174" r="3.5" fill="#C9A36A">
