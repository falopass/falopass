<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Diego Bravo Opazo - full-stack engineer, Chile">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#13201A" stroke-width="1"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A36A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9A36A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#C9A36A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="#0C1210"/>
  <rect width="1000" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="2" fill="url(#edge)"/>

  <text x="60" y="96" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="38" font-weight="700" fill="#E7E2D4">DIEGO BRAVO OPAZO</text>
  <text x="60" y="128" font-family="Consolas, 'Cascadia Mono', monospace" font-size="15" fill="#8FA39A">full-stack engineer · chile · python since 2020</text>

  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="12">
    <rect x="60" y="152" width="238" height="30" rx="6" fill="#101915" stroke="#C9A36A" stroke-opacity="0.7"/>
    <text x="74" y="171" fill="#C9A36A">ORCHESTRA · CONTROL PLANE</text>
    <rect x="60" y="190" width="238" height="30" rx="6" fill="#101915" stroke="#5EE4A3" stroke-opacity="0.6"/>
    <text x="74" y="209" fill="#5EE4A3">CALCULACHILE · +2K ORG/MO</text>
    <rect x="60" y="228" width="238" height="30" rx="6" fill="#101915" stroke="#E7E2D4" stroke-opacity="0.35"/>
    <text x="74" y="247" fill="#E7E2D4">SITIAZO · WEB STUDIO CL</text>
  </g>

  <g font-family="Consolas, 'Cascadia Mono', monospace">
    <rect x="560" y="52" width="392" height="200" rx="10" fill="#0F1713" stroke="#1E2A24"/>
    <rect x="560" y="52" width="392" height="30" rx="10" fill="#121B16"/>
    <rect x="560" y="72" width="392" height="10" fill="#121B16"/>
    <circle cx="580" cy="67" r="5" fill="#B85450"/>
    <circle cx="600" cy="67" r="5" fill="#C9A36A"/>
    <circle cx="620" cy="67" r="5" fill="#5EE4A3"/>
    <text x="756" y="71" font-size="12" fill="#6E7F76" text-anchor="middle">orchestra — doctor</text>

    <g font-size="13" xml:space="preserve">
      <text x="580" y="104" fill="#C9A36A">$ orchestra doctor</text>
      <text x="580" y="128"><tspan fill="#5EE4A3">✓ </tspan><tspan fill="#B9C4BD">codex app</tspan><tspan fill="#5EE4A3">        healthy</tspan></text>
      <text x="580" y="152"><tspan fill="#5EE4A3">✓ </tspan><tspan fill="#B9C4BD">router v0.4.0</tspan><tspan fill="#5EE4A3">    healthy</tspan></text>
      <text x="580" y="176"><tspan fill="#5EE4A3">✓ </tspan><tspan fill="#B9C4BD">providers</tspan><tspan fill="#5EE4A3">      creds present</tspan></text>
      <text x="580" y="200"><tspan fill="#5EE4A3">✓ </tspan><tspan fill="#B9C4BD">managed files</tspan><tspan fill="#5EE4A3">  markers ok</tspan></text>
      <text x="580" y="224" fill="#C9A36A">$ orchestra router start --confirm</text>
    </g>
    <rect x="580" y="232" width="8" height="14" fill="#C9A36A">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
