<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Diego Bravo Opazo, full-stack engineer from the Maule, Chile">
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Consolas,'Cascadia Mono',Menlo,monospace}
    .s{font-family:Georgia,'Times New Roman',serif}
    .l{opacity:0;animation:in .5s ease-out forwards}
    .l1{animation-delay:.5s}.l2{animation-delay:1.2s}.l3{animation-delay:1.9s}.l4{animation-delay:2.6s}.l5{animation-delay:3.3s}
    @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1.05s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 8s linear infinite}
    @keyframes scan{from{transform:translateX(-220px)}to{transform:translateX(1100px)}}
    .e{opacity:0;animation:rise 7s linear infinite}
    @keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-150px);opacity:0}}
    .p{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.l,.e,.scan,.cur,.p{animation:none}.l{opacity:1}.scan,.e{display:none}}
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#13201A" stroke-width="1"/>
    </pattern>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#C9A36A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C9A36A" stop-opacity=".85"/>
      <stop offset="1" stop-color="#C9A36A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#5EE4A3" stop-opacity="0"/>
      <stop offset=".85" stop-color="#5EE4A3" stop-opacity=".07"/>
      <stop offset="1" stop-color="#5EE4A3" stop-opacity=".22"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="340" fill="#0C1210"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <g class="scan"><rect width="180" height="340" fill="url(#beam)"/></g>
  <rect width="1000" height="2" fill="url(#edge)"/>

  <g fill="#E8743B">
    <circle class="e" cx="90" cy="338" r="1.6" style="animation-delay:0s"/>
    <circle class="e" cx="210" cy="338" r="2.2" style="animation-delay:1.6s;animation-duration:8s"/>
    <circle class="e" cx="330" cy="338" r="1.4" style="animation-delay:3.1s"/>
    <circle class="e" cx="455" cy="338" r="1.9" style="animation-delay:.9s;animation-duration:9s"/>
    <circle class="e" cx="610" cy="338" r="1.5" style="animation-delay:4.4s"/>
    <circle class="e" cx="780" cy="338" r="2.1" style="animation-delay:2.4s;animation-duration:8.5s"/>
    <circle class="e" cx="905" cy="338" r="1.6" style="animation-delay:5.2s"/>
  </g>

  <text x="60" y="86" class="m" font-size="13" fill="#C9A36A" letter-spacing="3">// SOVRAN</text>
  <text x="60" y="142" class="m" font-size="40" font-weight="700" fill="#E7E2D4">DIEGO BRAVO OPAZO</text>
  <text x="60" y="180" class="s" font-size="22" font-style="italic" fill="#B9C4BD">full-stack engineer from the Maule, Chile</text>
  <rect x="60" y="206" width="408" height="1" fill="#1E2A24"/>
  <text x="60" y="238" class="m" font-size="12.5" fill="#8FA39A" letter-spacing="3">DESIGN · BUILD · DEPLOY · OPERATE</text>
  <text x="60" y="274" class="m" font-size="12" fill="#5C6E65">python since 2020 · es / en · utalca</text>

  <g class="m">
    <rect x="548" y="56" width="404" height="232" rx="12" fill="#0F1713" stroke="#1E2A24"/>
    <path d="M548 68a12 12 0 0 1 12-12h380a12 12 0 0 1 12 12v18H548z" fill="#121B16"/>
    <circle cx="568" cy="71" r="5" fill="#B85450"/>
    <circle cx="588" cy="71" r="5" fill="#C9A36A"/>
    <circle cx="608" cy="71" r="5" fill="#5EE4A3"/>
    <text x="760" y="75" font-size="12" fill="#6E7F76" text-anchor="middle">diego@maule: ~/ship</text>

    <g font-size="13.5">
      <text class="l l1" x="570" y="118" fill="#C9A36A">$ ship --status</text>
      <text class="l l2" x="570" y="150"><tspan fill="#5EE4A3">●</tspan><tspan x="590" fill="#E7E2D4">calculachile</tspan><tspan x="716" fill="#8FA39A">46 calculators</tspan><tspan x="890" fill="#5EE4A3">live</tspan></text>
      <text class="l l3" x="570" y="178"><tspan fill="#E8743B">●</tspan><tspan x="590" fill="#E7E2D4">brasa</tspan><tspan x="716" fill="#8FA39A">10-min ingest</tspan><tspan x="890" fill="#E8743B">v0.6</tspan></text>
      <text class="l l4" x="570" y="206"><tspan fill="#C9A36A">●</tspan><tspan x="590" fill="#E7E2D4">sitiazo</tspan><tspan x="716" fill="#8FA39A">demo in 48 h</tspan><tspan x="890" fill="#C9A36A">live</tspan></text>
      <text class="l l5" x="570" y="246"><tspan fill="#C9A36A">$</tspan><tspan x="584" class="cur" fill="#E7E2D4">▍</tspan></text>
    </g>
  </g>
</svg>
